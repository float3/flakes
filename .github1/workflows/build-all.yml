name: build-all-flakes

on:
  workflow_dispatch:

jobs:
  build-flakes:
    name: Build all flakes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update sub-flakes
        run: |
          nix flake update --flake ./fish
          nix flake update --flake ./vim
          nix flake update --flake ./gnome
          nix flake update --flake ./tmux
          nix flake update --flake ./git
          nix flake update --flake ./vscode
          nix flake update --flake .

      - name: If scheduled or manually triggered, add updated flake.lock if changed, commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: "./"
          author_name: "github-actions"
          author_email: "github-actions@github.com"
